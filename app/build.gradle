plugins {
    id 'com.android.application'
}

def appUrl  = System.getenv('APP_URL')  ?: 'https://example.com'
def appName = System.getenv('APP_NAME') ?: 'My App'
def appId   = System.getenv('APP_ID')   ?: 'com.example.myapp'

android {
    namespace 'com.webtoapk.app'
    compileSdk 34

    defaultConfig {
        applicationId appId
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'APP_URL', '"' + appUrl + '"'
        resValue 'string', 'app_name', appName
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
